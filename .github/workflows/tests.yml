name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            testbench-version: '^9.0'
            phpunit-version: '^11.0'
            composer-options: '--no-blocking'
          - php-version: '8.2'
            testbench-version: '^10.0'
            phpunit-version: '^11.0'
            composer-options: ''
          - php-version: '8.3'
            testbench-version: '^11.0'
            phpunit-version: '^12.0'
            composer-options: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Select Laravel test matrix dependencies
        run: >-
          composer require --dev --no-update
          "orchestra/testbench:${{ matrix.testbench-version }}"
          "phpunit/phpunit:${{ matrix.phpunit-version }}"

      - name: Install dependencies
        run: >-
          composer update --no-interaction --no-progress --prefer-dist
          --with-all-dependencies ${{ matrix.composer-options }}

      - name: Run QA
        run: composer qa
